spring.application.name=auction-server
server.port=${PORT:8080}
spring.config.import=optional:file:./config/application-local.properties,optional:file:../config/application-local.properties

# Cấu hình kết nối TiDB Cloud (đưa db lên server của TiDB nhé)
spring.datasource.url=${DB_URL:jdbc:mysql://gateway01.ap-northeast-1.prod.aws.tidbcloud.com:4000/auction_db?sslMode=VERIFY_IDENTITY}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Cấu hình Hibernate & JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.otp.expiration-minutes=3
app.otp.resend-cooldown-seconds=60
app.otp.max-attempts=5

# ===== Gửi email =====
# Để TRỐNG phần spring.mail.* thì server KHÔNG gửi mail, chỉ in mã OTP ra console (tiện test).
# Muốn gửi mail thật: bỏ dấu # ở 7 dòng dưới (xem hướng dẫn Gmail ở cuối bài).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
app.mail.from=${spring.mail.username}
